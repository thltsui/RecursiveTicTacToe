[tool.poetry]
name = "ultimate-ttt"
version = "1.0.0"
description = "Ultimate Tic Tac Toe - An advanced variant of classic Tic Tac Toe"
authors = ["Ultimate Tic Tac Toe Team"]
readme = "README.md"
packages = [{include = "game"}, {include = "play"}, {include = "tests"}, {include = "scripts"}]
keywords = ["tic-tac-toe", "ultimate", "game", "board-game", "reinforcement-learning", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Games/Entertainment :: Board Games",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.poetry.dependencies]
python = "^3.8"
numpy = "^1.21.0"
torch = {version = "^2.0.0", optional = true}

[tool.poetry.extras]
ml = ["torch"]

[tool.poetry.group.dev.dependencies]
pytest = "^6.0"
pytest-cov = "^2.0"
black = "^21.0"
flake8 = "^3.8"
mypy = "^0.910"

[tool.poetry.scripts]
ultimate-ttt = "main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.urls]
"Homepage" = ""
"Repository" = ""
"Bug Tracker" = ""

[tool.black]
line-length = 88
target-version = ['py37', 'py38', 'py39', 'py310', 'py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
