<svg width="380" height="455" viewBox="0 0 380 455" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>UCB: exploration vs exploitation across 5 arms</title>
  <desc>Two stacked charts. Top: at t=12, Arm D has the lowest Q-hat but its uncertainty bonus is so large that its total UCB=1.19 beats all other arms (shown in amber). Bottom: at t=150, Arm A has been pulled 100 times so Q-hat dominates and its tiny remaining bonus still gives UCB=0.86, the highest among the five.</desc>

  <!-- ══════════════════════════════════════
       PANEL 1: Exploration (t=12)
  ══════════════════════════════════════ -->

  <!-- Title -->
  <text x="190" y="18" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">Exploration — t = 12</text>
  <text x="190" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#888780">Low Q̂, huge uncertainty — Arm D's UCB beats all</text>

  <!-- Y-axis gridlines (chart bottom=182, scale=104px/unit) -->
  <line x1="50" y1="182" x2="335" y2="182" stroke="#D3D1C7" stroke-width="0.5"/>
  <line x1="50" y1="130" x2="335" y2="130" stroke="#D3D1C7" stroke-width="0.5"/>
  <line x1="50" y1="78"  x2="335" y2="78"  stroke="#D3D1C7" stroke-width="0.5"/>

  <!-- Y-axis labels -->
  <text x="45" y="185" text-anchor="end" font-family="system-ui,sans-serif" font-size="11" fill="#888780">0</text>
  <text x="45" y="133" text-anchor="end" font-family="system-ui,sans-serif" font-size="11" fill="#888780">0.5</text>
  <text x="45" y="81"  text-anchor="end" font-family="system-ui,sans-serif" font-size="11" fill="#888780">1.0</text>

  <!-- ARM A: Q=0.70, bonus=0.39, UCB=1.09, μ=0.75, n=5 -->
  <rect x="50"  y="109" width="48" height="73" fill="#2a78d6" rx="2"/>
  <rect x="50"  y="69"  width="48" height="40" fill="#B5D4F4" rx="2"/>
  <line x1="48"  y1="104" x2="100" y2="104" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="74"  y="63" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#185FA5">1.09</text>

  <!-- ARM B: Q=0.52, bonus=0.50, UCB=1.02, μ=0.55, n=3 -->
  <rect x="108" y="128" width="48" height="54" fill="#2a78d6" rx="2"/>
  <rect x="108" y="76"  width="48" height="52" fill="#B5D4F4" rx="2"/>
  <line x1="106" y1="125" x2="158" y2="125" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="132" y="70" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#185FA5">1.02</text>

  <!-- ARM C: Q=0.44, bonus=0.61, UCB=1.05, μ=0.45, n=2 -->
  <rect x="166" y="136" width="48" height="46" fill="#2a78d6" rx="2"/>
  <rect x="166" y="73"  width="48" height="63" fill="#B5D4F4" rx="2"/>
  <line x1="164" y1="135" x2="216" y2="135" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="190" y="67" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#185FA5">1.05</text>

  <!-- ARM D (SELECTED): Q=0.32, bonus=0.87, UCB=1.19, μ=0.35, n=1 -->
  <rect x="224" y="149" width="48" height="33" fill="#eda100" rx="2"/>
  <rect x="224" y="58"  width="48" height="91" fill="#FAC775" rx="2"/>
  <line x1="222" y1="146" x2="274" y2="146" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="248" y="52" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#854F0B">1.19 ★</text>

  <!-- ARM E: Q=0.21, bonus=0.87, UCB=1.08, μ=0.20, n=1 -->
  <rect x="282" y="160" width="48" height="22" fill="#2a78d6" rx="2"/>
  <rect x="282" y="70"  width="48" height="90" fill="#B5D4F4" rx="2"/>
  <line x1="280" y1="161" x2="332" y2="161" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="306" y="64" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#185FA5">1.08</text>

  <!-- X-axis labels panel 1 -->
  <text x="74"  y="196" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#52514e">A</text>
  <text x="132" y="196" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#52514e">B</text>
  <text x="190" y="196" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#52514e">C</text>
  <text x="248" y="196" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#854F0B">D</text>
  <text x="306" y="196" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#52514e">E</text>

  <!-- Pull counts panel 1 -->
  <text x="74"  y="209" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#B4B2A9">n=5</text>
  <text x="132" y="209" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#B4B2A9">n=3</text>
  <text x="190" y="209" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#B4B2A9">n=2</text>
  <text x="248" y="209" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#854F0B">n=1</text>
  <text x="306" y="209" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#B4B2A9">n=1</text>

  <!-- Separator -->
  <line x1="30" y1="223" x2="350" y2="223" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="8,5"/>

  <!-- ══════════════════════════════════════
       PANEL 2: Exploitation (t=150)
  ══════════════════════════════════════ -->

  <text x="190" y="237" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">Exploitation — t = 150</text>
  <text x="190" y="251" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#888780">Q̂ converges to μ* — exploration bonus fades out</text>

  <!-- Y-axis gridlines panel 2 (chart bottom=387, scale=104px/unit) -->
  <line x1="50" y1="387" x2="335" y2="387" stroke="#D3D1C7" stroke-width="0.5"/>
  <line x1="50" y1="335" x2="335" y2="335" stroke="#D3D1C7" stroke-width="0.5"/>
  <line x1="50" y1="283" x2="335" y2="283" stroke="#D3D1C7" stroke-width="0.5"/>

  <text x="45" y="390" text-anchor="end" font-family="system-ui,sans-serif" font-size="11" fill="#888780">0</text>
  <text x="45" y="338" text-anchor="end" font-family="system-ui,sans-serif" font-size="11" fill="#888780">0.5</text>
  <text x="45" y="286" text-anchor="end" font-family="system-ui,sans-serif" font-size="11" fill="#888780">1.0</text>

  <!-- ARM A (SELECTED): Q=0.74, bonus=0.12, UCB=0.86, μ=0.75, n=100 -->
  <rect x="50"  y="310" width="48" height="77" fill="#eda100" rx="2"/>
  <rect x="50"  y="298" width="48" height="12" fill="#FAC775" rx="2"/>
  <line x1="48"  y1="309" x2="100" y2="309" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="74"  y="292" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#854F0B">0.86 ★</text>

  <!-- ARM B: Q=0.54, bonus=0.26, UCB=0.80, μ=0.55, n=22 -->
  <rect x="108" y="331" width="48" height="56" fill="#2a78d6" rx="2"/>
  <rect x="108" y="304" width="48" height="27" fill="#B5D4F4" rx="2"/>
  <line x1="106" y1="330" x2="158" y2="330" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="132" y="298" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#185FA5">0.80</text>

  <!-- ARM C: Q=0.44, bonus=0.33, UCB=0.77, μ=0.45, n=14 -->
  <rect x="166" y="341" width="48" height="46" fill="#2a78d6" rx="2"/>
  <rect x="166" y="307" width="48" height="34" fill="#B5D4F4" rx="2"/>
  <line x1="164" y1="340" x2="216" y2="340" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="190" y="301" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#185FA5">0.77</text>

  <!-- ARM D: Q=0.34, bonus=0.39, UCB=0.73, μ=0.35, n=10 -->
  <rect x="224" y="352" width="48" height="35" fill="#2a78d6" rx="2"/>
  <rect x="224" y="311" width="48" height="41" fill="#B5D4F4" rx="2"/>
  <line x1="222" y1="351" x2="274" y2="351" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="248" y="305" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#185FA5">0.73</text>

  <!-- ARM E: Q=0.18, bonus=0.62, UCB=0.80, μ=0.20, n=4 -->
  <rect x="282" y="368" width="48" height="19" fill="#2a78d6" rx="2"/>
  <rect x="282" y="304" width="48" height="64" fill="#B5D4F4" rx="2"/>
  <line x1="280" y1="366" x2="332" y2="366" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="306" y="298" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#185FA5">0.80</text>

  <!-- X-axis labels panel 2 -->
  <text x="74"  y="401" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#854F0B">A</text>
  <text x="132" y="401" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#52514e">B</text>
  <text x="190" y="401" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#52514e">C</text>
  <text x="248" y="401" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#52514e">D</text>
  <text x="306" y="401" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#52514e">E</text>

  <!-- Pull counts panel 2 -->
  <text x="74"  y="413" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#854F0B">n=100</text>
  <text x="132" y="413" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#B4B2A9">n=22</text>
  <text x="190" y="413" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#B4B2A9">n=14</text>
  <text x="248" y="413" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#B4B2A9">n=10</text>
  <text x="306" y="413" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#B4B2A9">n=4</text>

  <!-- ─── LEGEND ─── -->
  <rect x="30"  y="430" width="12" height="10" rx="1" fill="#2a78d6"/>
  <text x="46"  y="439" font-family="system-ui,sans-serif" font-size="11" fill="#52514e">Q̂ (sample mean)</text>
  <rect x="155" y="430" width="12" height="10" rx="1" fill="#B5D4F4"/>
  <text x="171" y="439" font-family="system-ui,sans-serif" font-size="11" fill="#52514e">Bonus  √(log t/n)</text>
  <line x1="296" y1="435" x2="312" y2="435" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="316" y="439" font-family="system-ui,sans-serif" font-size="11" fill="#52514e">True μ</text>
</svg>
