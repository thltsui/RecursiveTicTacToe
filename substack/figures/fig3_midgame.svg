<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5 -85 370 385" width="700" height="570" font-family="monospace">
  <!-- Background -->
  <rect x="-5" y="-85" width="370" height="385" fill="#1a1a2e"/>

  <!-- Sub-board backgrounds (each is 90px, with 10px gaps = 3*90+2*10=290, but let's use 100px per sub-board for 300px total) -->
  <!-- Sub-board layout: 3x3 grid of 3x3 cells, each cell=30px, sub-board=90px, gap=5px -->
  <!-- Sub-board (row,col): top-left corner at (col*95, row*95) -->

  <!-- Sub-board backgrounds by state -->
  <!-- (0,0) X won - blue tint -->
  <rect x="0" y="0" width="90" height="90" fill="#1e3a5f"/>
  <!-- (0,1) O won - red tint -->
  <rect x="95" y="0" width="90" height="90" fill="#5f1e1e"/>
  <!-- (0,2) open - no tint (dark bg) -->
  <rect x="190" y="0" width="90" height="90" fill="#1a1a2e"/>
  <!-- (1,0) open -->
  <rect x="0" y="95" width="90" height="90" fill="#1a1a2e"/>
  <!-- (1,1) X won - blue -->
  <rect x="95" y="95" width="90" height="90" fill="#1e3a5f"/>
  <!-- (1,2) ACTIVE - yellow tint -->
  <rect x="190" y="95" width="90" height="90" fill="#3d3000"/>
  <!-- (2,0) drawn - grey -->
  <rect x="0" y="190" width="90" height="90" fill="#2a2a2a"/>
  <!-- (2,1) open -->
  <rect x="95" y="190" width="90" height="90" fill="#1a1a2e"/>
  <!-- (2,2) O won - red -->
  <rect x="190" y="190" width="90" height="90" fill="#5f1e1e"/>

  <!-- Inner grid lines for each sub-board -->
  <!-- Sub-board (r,c): origin at (c*95, r*95), lines at +30 and +60 -->
  <g stroke="#555566" stroke-width="0.8">
    <!-- (0,0) -->
    <line x1="30" y1="0" x2="30" y2="90"/> <line x1="60" y1="0" x2="60" y2="90"/>
    <line x1="0" y1="30" x2="90" y2="30"/> <line x1="0" y1="60" x2="90" y2="60"/>
    <!-- (0,1) -->
    <line x1="125" y1="0" x2="125" y2="90"/> <line x1="155" y1="0" x2="155" y2="90"/>
    <line x1="95" y1="30" x2="185" y2="30"/> <line x1="95" y1="60" x2="185" y2="60"/>
    <!-- (0,2) -->
    <line x1="220" y1="0" x2="220" y2="90"/> <line x1="250" y1="0" x2="250" y2="90"/>
    <line x1="190" y1="30" x2="280" y2="30"/> <line x1="190" y1="60" x2="280" y2="60"/>
    <!-- (1,0) -->
    <line x1="30" y1="95" x2="30" y2="185"/> <line x1="60" y1="95" x2="60" y2="185"/>
    <line x1="0" y1="125" x2="90" y2="125"/> <line x1="0" y1="155" x2="90" y2="155"/>
    <!-- (1,1) -->
    <line x1="125" y1="95" x2="125" y2="185"/> <line x1="155" y1="95" x2="155" y2="185"/>
    <line x1="95" y1="125" x2="185" y2="125"/> <line x1="95" y1="155" x2="185" y2="155"/>
    <!-- (1,2) -->
    <line x1="220" y1="95" x2="220" y2="185"/> <line x1="250" y1="95" x2="250" y2="185"/>
    <line x1="190" y1="125" x2="280" y2="125"/> <line x1="190" y1="155" x2="280" y2="155"/>
    <!-- (2,0) -->
    <line x1="30" y1="190" x2="30" y2="280"/> <line x1="60" y1="190" x2="60" y2="280"/>
    <line x1="0" y1="220" x2="90" y2="220"/> <line x1="0" y1="250" x2="90" y2="250"/>
    <!-- (2,1) -->
    <line x1="125" y1="190" x2="125" y2="280"/> <line x1="155" y1="190" x2="155" y2="280"/>
    <line x1="95" y1="220" x2="185" y2="220"/> <line x1="95" y1="250" x2="185" y2="250"/>
    <!-- (2,2) -->
    <line x1="220" y1="190" x2="220" y2="280"/> <line x1="250" y1="190" x2="250" y2="280"/>
    <line x1="190" y1="220" x2="280" y2="220"/> <line x1="190" y1="250" x2="280" y2="250"/>
  </g>

  <!-- PIECES: X pieces (light blue), O pieces (light red/pink) -->
  <!-- X drawn as two crossing lines in 30px cell, centered, offset ~8px from center -->
  <!-- O drawn as circle, radius ~9px -->

  <!-- (0,0) X won sub-board pieces: X,O,X / O,X,O / X,O,X -->
  <g stroke="#4fc3f7" stroke-width="2.2" stroke-linecap="round">
    <line x1="7" y1="7" x2="23" y2="23"/> <line x1="23" y1="7" x2="7" y2="23"/>
    <line x1="67" y1="7" x2="83" y2="23"/> <line x1="83" y1="7" x2="67" y2="23"/>
    <line x1="37" y1="37" x2="53" y2="53"/> <line x1="53" y1="37" x2="37" y2="53"/>
    <line x1="7" y1="67" x2="23" y2="83"/> <line x1="23" y1="67" x2="7" y2="83"/>
  </g>
  <g stroke="#ef9a9a" stroke-width="2.2" fill="none">
    <circle cx="45" cy="15" r="9"/>
    <circle cx="15" cy="45" r="9"/>
    <circle cx="75" cy="45" r="9"/>
    <circle cx="45" cy="75" r="9"/>
  </g>
  <!-- Big X overlay for (0,0) won -->
  <g stroke="#4fc3f7" stroke-width="6" stroke-linecap="round" opacity="0.55">
    <line x1="10" y1="10" x2="80" y2="80"/> <line x1="80" y1="10" x2="10" y2="80"/>
  </g>

  <!-- (0,1) O won sub-board pieces: O,X,O / X,O,X / O,O,O -->
  <g stroke="#ef9a9a" stroke-width="2.2" fill="none">
    <circle cx="110" cy="15" r="9"/>
    <circle cx="170" cy="15" r="9"/>
    <circle cx="140" cy="45" r="9"/>
    <circle cx="110" cy="75" r="9"/>
    <circle cx="140" cy="75" r="9"/>
    <circle cx="170" cy="75" r="9"/>
  </g>
  <g stroke="#4fc3f7" stroke-width="2.2" stroke-linecap="round">
    <line x1="127" y1="7" x2="143" y2="23"/> <line x1="143" y1="7" x2="127" y2="23"/>
    <line x1="157" y1="37" x2="173" y2="53"/> <line x1="173" y1="37" x2="157" y2="53"/>
    <line x1="97" y1="37" x2="113" y2="53"/> <line x1="113" y1="37" x2="97" y2="53"/>
  </g>
  <!-- Big O overlay for (0,1) won -->
  <circle cx="140" cy="45" r="35" stroke="#ef9a9a" stroke-width="6" fill="none" opacity="0.55"/>

  <!-- (0,2) open sub-board partial pieces -->
  <g stroke="#4fc3f7" stroke-width="2.2" stroke-linecap="round">
    <line x1="197" y1="7" x2="213" y2="23"/> <line x1="213" y1="7" x2="197" y2="23"/>
    <line x1="257" y1="37" x2="273" y2="53"/> <line x1="273" y1="37" x2="257" y2="53"/>
  </g>
  <g stroke="#ef9a9a" stroke-width="2.2" fill="none">
    <circle cx="235" cy="15" r="9"/>
    <circle cx="235" cy="45" r="9"/>
  </g>

  <!-- (1,0) open sub-board partial pieces -->
  <g stroke="#4fc3f7" stroke-width="2.2" stroke-linecap="round">
    <line x1="37" y1="102" x2="53" y2="118"/> <line x1="53" y1="102" x2="37" y2="118"/>
    <line x1="67" y1="132" x2="83" y2="148"/> <line x1="83" y1="132" x2="67" y2="148"/>
  </g>
  <g stroke="#ef9a9a" stroke-width="2.2" fill="none">
    <circle cx="15" cy="140" r="9"/>
    <circle cx="75" cy="170" r="9"/>
  </g>

  <!-- (1,1) X won sub-board pieces: X,O,O / O,X,O / X,X,X -->
  <g stroke="#4fc3f7" stroke-width="2.2" stroke-linecap="round">
    <line x1="102" y1="102" x2="118" y2="118"/> <line x1="118" y1="102" x2="102" y2="118"/>
    <line x1="132" y1="132" x2="148" y2="148"/> <line x1="148" y1="132" x2="132" y2="148"/>
    <line x1="102" y1="162" x2="118" y2="178"/> <line x1="118" y1="162" x2="102" y2="178"/>
    <line x1="132" y1="162" x2="148" y2="178"/> <line x1="148" y1="162" x2="132" y2="178"/>
    <line x1="162" y1="162" x2="178" y2="178"/> <line x1="178" y1="162" x2="162" y2="178"/>
  </g>
  <g stroke="#ef9a9a" stroke-width="2.2" fill="none">
    <circle cx="140" cy="110" r="9"/>
    <circle cx="170" cy="110" r="9"/>
    <circle cx="110" cy="140" r="9"/>
    <circle cx="170" cy="140" r="9"/>
  </g>
  <!-- Big X overlay for (1,1) won -->
  <g stroke="#4fc3f7" stroke-width="6" stroke-linecap="round" opacity="0.55">
    <line x1="105" y1="105" x2="175" y2="175"/> <line x1="175" y1="105" x2="105" y2="175"/>
  </g>

  <!-- (1,2) ACTIVE sub-board partial pieces -->
  <g stroke="#4fc3f7" stroke-width="2.2" stroke-linecap="round">
    <line x1="227" y1="132" x2="243" y2="148"/> <line x1="243" y1="132" x2="227" y2="148"/>
    <line x1="197" y1="162" x2="213" y2="178"/> <line x1="213" y1="162" x2="197" y2="178"/>
  </g>
  <g stroke="#ef9a9a" stroke-width="2.2" fill="none">
    <circle cx="205" cy="110" r="9"/>
    <circle cx="235" cy="170" r="9"/>
  </g>

  <!-- (2,0) drawn sub-board pieces: X,O,X / O,X,O / O,X,O -->
  <g stroke="#4fc3f7" stroke-width="2.2" stroke-linecap="round">
    <line x1="7" y1="197" x2="23" y2="213"/> <line x1="23" y1="197" x2="7" y2="213"/>
    <line x1="67" y1="197" x2="83" y2="213"/> <line x1="83" y1="197" x2="67" y2="213"/>
    <line x1="37" y1="227" x2="53" y2="243"/> <line x1="53" y1="227" x2="37" y2="243"/>
    <line x1="37" y1="257" x2="53" y2="273"/> <line x1="53" y1="257" x2="37" y2="273"/>
  </g>
  <g stroke="#ef9a9a" stroke-width="2.2" fill="none">
    <circle cx="45" cy="205" r="9"/>
    <circle cx="15" cy="235" r="9"/>
    <circle cx="75" cy="235" r="9"/>
    <circle cx="15" cy="265" r="9"/>
    <circle cx="75" cy="265" r="9"/>
  </g>
  <!-- Drawn indicator: dash -->
  <line x1="20" y1="235" x2="70" y2="235" stroke="#888899" stroke-width="5" stroke-linecap="round" opacity="0.55"/>

  <!-- (2,1) open sub-board partial pieces -->
  <g stroke="#ef9a9a" stroke-width="2.2" fill="none">
    <circle cx="140" cy="205" r="9"/>
    <circle cx="170" cy="265" r="9"/>
  </g>
  <g stroke="#4fc3f7" stroke-width="2.2" stroke-linecap="round">
    <line x1="97" y1="227" x2="113" y2="243"/> <line x1="113" y1="227" x2="97" y2="243"/>
  </g>

  <!-- (2,2) O won sub-board pieces: X,X,O / X,O,X / O,O,O -->
  <g stroke="#4fc3f7" stroke-width="2.2" stroke-linecap="round">
    <line x1="197" y1="197" x2="213" y2="213"/> <line x1="213" y1="197" x2="197" y2="213"/>
    <line x1="227" y1="197" x2="243" y2="213"/> <line x1="243" y1="197" x2="227" y2="213"/>
    <line x1="197" y1="227" x2="213" y2="243"/> <line x1="213" y1="227" x2="197" y2="243"/>
    <line x1="257" y1="227" x2="273" y2="243"/> <line x1="273" y1="227" x2="257" y2="243"/>
  </g>
  <g stroke="#ef9a9a" stroke-width="2.2" fill="none">
    <circle cx="265" cy="205" r="9"/>
    <circle cx="235" cy="235" r="9"/>
    <circle cx="205" cy="265" r="9"/>
    <circle cx="235" cy="265" r="9"/>
    <circle cx="265" cy="265" r="9"/>
  </g>
  <!-- Big O overlay for (2,2) won -->
  <circle cx="235" cy="235" r="35" stroke="#ef9a9a" stroke-width="6" fill="none" opacity="0.55"/>

  <!-- OUTER GRID LINES (thick) -->
  <g stroke="#aaaacc" stroke-width="3">
    <line x1="92" y1="0" x2="92" y2="280"/>
    <line x1="187" y1="0" x2="187" y2="280"/>
    <line x1="0" y1="92" x2="280" y2="92"/>
    <line x1="0" y1="187" x2="280" y2="187"/>
  </g>

  <!-- Outer border -->
  <rect x="0" y="0" width="280" height="280" fill="none" stroke="#aaaacc" stroke-width="2.5"/>

  <!-- ACTIVE sub-board highlight border (yellow, (1,2)) -->
  <rect x="190" y="95" width="90" height="90" fill="none" stroke="#ffd600" stroke-width="4"/>

  <!-- LEGEND -->
  <text x="140" y="-62" fill="#ccccdd" font-size="14" font-weight="bold" text-anchor="middle">Mid-game UTTT Position</text>

  <!-- Legend items -->
  <rect x="0" y="-50" width="18" height="14" fill="#1e3a5f" stroke="#4fc3f7" stroke-width="1.2"/>
  <text x="22" y="-39" fill="#ccccdd" font-size="11">X wins sub-board</text>

  <rect x="80" y="-50" width="18" height="14" fill="#5f1e1e" stroke="#ef9a9a" stroke-width="1.2"/>
  <text x="102" y="-39" fill="#ccccdd" font-size="11">O wins sub-board</text>

  <rect x="180" y="-50" width="18" height="14" fill="#2a2a2a" stroke="#888899" stroke-width="1.2"/>
  <text x="202" y="-39" fill="#ccccdd" font-size="11">Drawn</text>

  <rect x="240" y="-50" width="18" height="14" fill="#3d3000" stroke="#ffd600" stroke-width="1.5"/>
  <text x="262" y="-39" fill="#ccccdd" font-size="11">Active</text>
</svg>
