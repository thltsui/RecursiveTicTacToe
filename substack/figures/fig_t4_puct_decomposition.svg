  <text x="86"  y="129" text-anchor="end" font-family="system-ui,sans-serif" font-size="10" fill="#888780">P=0.10</text>
  <rect x="90" y="116" width="100" height="18" fill="#2a78d6" rx="2"/>
  <rect x="190" y="116" width="26"  height="18" fill="#B5D4F4" rx="2"/>
  <text x="221" y="129" font-family="system-ui,sans-serif" font-size="11" fill="#185FA5">0.51</text>

  <!-- E: P=0.05, Q=0.30, PUCT=0.38 -->
  <text x="12"  y="155" font-family="system-ui,sans-serif" font-size="12" fill="#52514e">E</text>
  <text x="86"  y="155" text-anchor="end" font-family="system-ui,sans-serif" font-size="10" fill="#888780">P=0.05</text>
