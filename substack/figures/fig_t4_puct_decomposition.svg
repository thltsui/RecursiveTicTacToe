  <!-- E: Q=0.35, n=10, PUCT=0.45 -->
  <text x="12"  y="325" font-family="system-ui,sans-serif" font-size="12" fill="#52514e">E</text>
  <text x="86"  y="325" text-anchor="end" font-family="system-ui,sans-serif" font-size="10" fill="#888780">n=10</text>
  <rect x="90" y="312" width="88"  height="18" fill="#2a78d6" rx="2"/>
  <rect x="178" y="312" width="26"  height="18" fill="#B5D4F4" rx="2"/>
  <text x="209" y="325" font-family="system-ui,sans-serif" font-size="11" fill="#185FA5">0.45</text>

  <!-- ─── LEGEND ─── -->
  <rect x="30"  y="344" width="12" height="10" rx="1" fill="#2a78d6"/>
  <text x="46"  y="353" font-family="system-ui,sans-serif" font-size="11" fill="#52514e">Q(s,a)</text>
  <rect x="100" y="344" width="12" height="10" rx="1" fill="#B5D4F4"/>
  <text x="116" y="353" font-family="system-ui,sans-serif" font-size="11" fill="#52514e">P(s,a)·bonus</text>
  <rect x="214" y="344" width="12" height="10" rx="1" fill="#eda100"/>
  <text x="230" y="353" font-family="system-ui,sans-serif" font-size="11" fill="#52514e">Selected move</text>
</svg>
