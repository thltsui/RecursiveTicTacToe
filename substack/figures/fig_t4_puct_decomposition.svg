  <text x="86"  y="273" text-anchor="end" font-family="system-ui,sans-serif" font-size="10" fill="#888780">n=60</text>
  <rect x="90" y="260" width="120" height="18" fill="#2a78d6" rx="2"/>
  <rect x="210" y="260" width="14"  height="18" fill="#B5D4F4" rx="2"/>
  <text x="229" y="273" font-family="system-ui,sans-serif" font-size="11" fill="#185FA5">0.54</text>

  <!-- D: Q=0.42, n=30, PUCT=0.49 -->
  <text x="12"  y="299" font-family="system-ui,sans-serif" font-size="12" fill="#52514e">D</text>
  <text x="86"  y="299" text-anchor="end" font-family="system-ui,sans-serif" font-size="10" fill="#888780">n=30</text>
  <rect x="90" y="286" width="105" height="18" fill="#2a78d6" rx="2"/>
  <rect x="195" y="286" width="18"  height="18" fill="#B5D4F4" rx="2"/>
