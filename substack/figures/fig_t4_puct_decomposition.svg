  <rect x="228" y="90" width="40"  height="18" fill="#B5D4F4" rx="2"/>
  <text x="273" y="103" font-family="system-ui,sans-serif" font-size="11" fill="#185FA5">0.71</text>

  <!-- D: P=0.10, Q=0.40, PUCT=0.51 -->
