  <rect x="165" y="142" width="20"  height="18" fill="#B5D4F4" rx="2"/>
  <text x="190" y="155" font-family="system-ui,sans-serif" font-size="11" fill="#185FA5">0.38</text>

  <!-- Separator -->
  <line x1="30" y1="172" x2="350" y2="172" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="8,5"/>

  <!-- ══════════════════════════════════════
       PANEL 2: Late search — N(s) = 500
