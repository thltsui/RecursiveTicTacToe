<svg width="380" height="365" viewBox="0 0 380 365" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>PUCT score decomposition: early vs late search</title>

  <!-- ══════════════════════════════════════
       PANEL 1: Early search — N(s) = 10
       Row tops: 38, 64, 90, 116, 142
  ══════════════════════════════════════ -->

  <text x="190" y="17" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">Early search — N(s) = 10</text>


  <!-- A (selected): P=0.40, Q=0.50, PUCT=0.82 -->
  <text x="12"  y="51" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#854F0B">A</text>
  <text x="86"  y="51" text-anchor="end" font-family="system-ui,sans-serif" font-size="10" fill="#888780">P=0.40</text>
  <rect x="90" y="38" width="125" height="18" fill="#eda100" rx="2"/>
  <rect x="215" y="38" width="79"  height="18" fill="#FAC775" rx="2"/>
  <text x="299" y="51" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#854F0B">0.82 ★</text>

  <!-- B: P=0.30, Q=0.45, PUCT=0.77 -->
  <text x="12"  y="77" font-family="system-ui,sans-serif" font-size="12" fill="#52514e">B</text>
  <text x="86"  y="77" text-anchor="end" font-family="system-ui,sans-serif" font-size="10" fill="#888780">P=0.30</text>
  <rect x="90" y="64" width="113" height="18" fill="#2a78d6" rx="2"/>
  <rect x="203" y="64" width="79"  height="18" fill="#B5D4F4" rx="2"/>
