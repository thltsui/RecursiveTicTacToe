  ══════════════════════════════════════ -->

  <text x="190" y="189" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">Late search — N(s) = 500</text>


  <!-- A (selected): Q=0.68, n=280, PUCT=0.71 -->
